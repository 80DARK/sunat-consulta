[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sunat-consulta"
version = "0.1.0"
description = "Cliente Python y API FastAPI para consultar datos publicos de SUNAT."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "USUARIO" },
]
keywords = ["sunat", "ruc", "dni", "peru", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
sunat-consulta-api = "sunat_consulta_api.cli:main"

[project.urls]
Homepage = "https://github.com/tu-usuario/sunat-consulta"
Issues = "https://github.com/tu-usuario/sunat-consulta/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
